http:
  routers:
    # 1. Default Honeypot Decoy Router
    router-fakesuccess:
      rule: "PathPrefix(`/mode/fakesuccess`) || PathPrefix(`/`)"
      priority: 10
      entryPoints: [web]
      middlewares: [warden-fakesuccess]
      service: whoami-service

    # 2. JSON Response Mode
    router-json:
      rule: "PathPrefix(`/mode/json`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-json]
      service: whoami-service

    # 3. HTML Response Mode
    router-html:
      rule: "PathPrefix(`/mode/html`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-html]
      service: whoami-service

    # 4. Silent Drop Mode (Abrupt TCP close / RST_STREAM)
    router-silentdrop:
      rule: "PathPrefix(`/mode/silentdrop`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-silentdrop]
      service: whoami-service

    # 5. Rate Limit Challenge Mode (HTTP 429 + Retry-After)
    router-ratelimit:
      rule: "PathPrefix(`/mode/ratelimit`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-ratelimit]
      service: whoami-service

    # 6. Redirect Mode (HTTP 302 to safe URL)
    router-redirect:
      rule: "PathPrefix(`/mode/redirect`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-redirect]
      service: whoami-service

    # 7. XML Mode
    router-xml:
      rule: "PathPrefix(`/mode/xml`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-xml]
      service: whoami-service

    # 8. Interactive Captcha Mode
    router-captcha:
      rule: "PathPrefix(`/mode/captcha`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-captcha]
      service: whoami-service

    # 9. Gzip Bomb Defense Mode
    router-gzipbomb:
      rule: "PathPrefix(`/mode/gzipbomb`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-gzipbomb]
      service: whoami-service

    # 10. Garbage Stream Defense Mode
    router-garbagestream:
      rule: "PathPrefix(`/mode/garbagestream`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-garbagestream]
      service: whoami-service

    # 11. Plain Text Mode (Default 403)
    router-text:
      rule: "PathPrefix(`/mode/text`)"
      priority: 100
      entryPoints: [web]
      middlewares: [warden-text]
      service: whoami-service

  services:
    whoami-service:
      loadBalancer:
        servers:
          - url: "http://whoami:80"

  middlewares:
    # 1. fakeSuccess / decoy honeypot
    warden-fakesuccess:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: fakeSuccess

    # 2. JSON error
    warden-json:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: json
          statusCode: 403

    # 3. HTML styled page
    warden-html:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: html
          statusCode: 403

    # 4. Silent Drop (Connection reset / empty reply)
    warden-silentdrop:
      plugin:
        routewarden:
          enabled: true
          debug: true
          silentDrop: true

    # 5. Rate Limit Challenge
    warden-ratelimit:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: rateLimit
          response:
            retryAfterSeconds: 60

    # 6. Redirect
    warden-redirect:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: redirect
          response:
            redirectUrl: "https://example.com/security-warning"

    # 7. XML
    warden-xml:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: xml

    # 8. Captcha
    warden-captcha:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: captcha
          response:
            captcha:
              provider: "turnstile"
              title: "RouteWarden Challenge"

    # 9. Gzip Bomb
    warden-gzipbomb:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: gzipBomb

    # 10. Garbage Stream
    warden-garbagestream:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: garbageStream
          response:
            streamSizeMB: 1

    # 11. Plain Text
    warden-text:
      plugin:
        routewarden:
          enabled: true
          debug: true
          mode: text
